<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Safety & Disaster Reporting Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/style/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <!-- Custom Styles -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <!-- Main Navigation Bar -->
     <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" href="#">Community Safety & Hazard Map</a>
        <button class="btn btn-outline-light ms-auto" data-bs-toggle="modal" data-bs-target="#reportModal">
            + Report New Hazard
        </button>
     </nav>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Control Panel -->
    <div class="control-panel">
        <h5 class="class-title mb-2">Hazard Filter & Alerts</h5>
         
        <!-- Text Search -->
        <input type="text" id="searchInput" class="form_control mb-2" placeholder="Search hazards or areas...">

        <!-- Spatial Actions -->
        <div class="d-grid gap-2 mb-2">
            <button id="resetBtn" class="btn btn-primary btn-sm" type="button">Reset Map View</button>
        </div>
    </div>

    <!-- Info Box -->
    <div class="info-box">
        <h4>Map Information</h4>
        <p>Cities loaded: <strong id="cityCount">0</strong></p>
        <p>Click on markers to view city details.</p>
    </div>

    <!-- Loading Indicator -->
    <div class="loading" id="loading">Loading cities data...</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <!-- Leaflet Heat JS -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    
    <!-- Custom Map Script -->
    {% load static %}
    <script src="{% static 'js/map.js' %}"></script>
</body>
</html>
